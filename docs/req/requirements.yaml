datasets:
- id: DS-CONTRACT
  protocol_id: VP-CONTRACT
  status: planned
  planned_cases: 20
  definition: 10 合法 + 10 非法输入；冻结 ticker、日期、预算、模型、策略与 prompt；拒绝前无外部请求。
  fixture_path: null
  results_path: null
- id: DS-EVIDENCE
  protocol_id: VP-EVIDENCE
  status: planned
  planned_cases: 20
  definition: 正常、重复、不同来源同文、未来、时间未知、引用越 run、无数据及源不可达。
  fixture_path: null
  results_path: null
- id: DS-DEBATE
  protocol_id: VP-DEBATE
  status: planned
  planned_cases: 12
  definition: 论点卡片、事实/推断分离、引用缺失、冲突、重复和受预算限制的停止。
  fixture_path: null
  results_path: null
- id: DS-SAFETY
  protocol_id: VP-SAFETY
  status: planned
  planned_cases: 110
  definition: 100 个违规案例（5 类各 20）另加 10 合法控制；分类为交易/工具越权、引用与时点、格式与状态绕过、注入、篡改。
  fixture_path: null
  results_path: null
- id: DS-BUDGET
  protocol_id: VP-BUDGET
  status: planned
  planned_cases: 30
  definition: 成功/失败/回退/重试/并发预留/未知用量/输出上限/超时；用模拟时钟和 provider stub，不消耗真实额度。
  fixture_path: null
  results_path: null
- id: DS-REVIEW
  protocol_id: VP-REVIEW
  status: planned
  planned_cases: 12
  definition: 合法批准、拒绝、未审阅、内容更改、策略更改与旧批准重放。
  fixture_path: null
  results_path: null
- id: DS-REPLAY
  protocol_id: VP-REPLAY
  status: planned
  planned_cases: 10
  definition: 10 个已冻结响应 fixture 各回放两次；排除 run ID、时间与耗时后比内容和状态。
  fixture_path: null
  results_path: null
- id: DS-PERF
  protocol_id: VP-PERF
  status: planned
  planned_cases: 100
  definition: 5 次预热后 100 次纯本地 gate；100 个事实、25 个证据、输入 ≤1 MiB；p95 为排序第95个。
  fixture_path: null
  results_path: null
- id: DS-LIVE
  protocol_id: VP-LIVE
  status: planned
  planned_cases: 12
  definition: 3固定股票任务×2重复×baseline/candidate；共同当期快照，单人隐藏组别标注并间隔复核，所有失败保留。
  fixture_path: null
  results_path: null
- id: DS-GOV
  protocol_id: VP-GOV
  status: planned
  planned_cases: 24
  definition: 至少24例：GOV-003六类gate各一例通过和一例拒绝（12例），另六条治理要求各一对（12例）；分支保护与ADR等还需配置证据。
  fixture_path: null
  results_path: null
requirements:
- id: FR-001
  type: functional
  title: 版本化研究运行契约
  statement: 系统必须在任何模型或行情请求前校验 ticker、UTC 分析截点、模型、数据源与预算，并为合法输入保存不可变版本的 RunManifest；首版支持 AAPL/MSFT/NVDA 与 market/news
    分析师。
  priority: Must
  status: proposed
  owner: solo_student
  scope: extended_baseline
  source_ids:
  - SRC-USER
  - SRC-UP-README
  - SRC-UP-GRAPH
  - SRC-PROPOSAL
  rationale: 把新增策略绑定具体运行，减少不可比较实验和配置漂移。
  tradeoff: 首版仅三个美股标的；不将上游已有的 CLI 和 ticker 选择视为原创。
  related_ids:
  - FR-002
  - FR-005
  fit_criterion:
    protocol_id: VP-CONTRACT
    preconditions: 阈值、基线、数据集与协议先经人工评审并冻结；下列测试尚未实施。
    metrics:
    - name: contract_assertion_pass_rate
      operator: gte
      target: 1.0
      unit: ratio
      measurement: DS-CONTRACT 中符合预期的输入、冻结与状态断言数 / 全部预定断言数。
    - name: external_calls_on_invalid_input
      operator: eq
      target: 0
      unit: count
      measurement: 10 个非法输入在拒绝前启动的模型与数据请求总数。
    positive_case: 合法 AAPL 与非未来日期生成包含模型/prompt/policy/预算/数据版本且不含密钥的 manifest。
    negative_case: ticker 含路径穿越、未来日期、未知模型或负预算时，拒绝且请求数为0。
  verification:
    tier: behavioral
    planned_test_ids:
    - AT-FR-001-POS
    - AT-FR-001-NEG
    evidence_status: not_run
    evidence_paths: []
- id: FR-002
  type: functional
  title: 证据台账与时点资格
  statement: 系统必须为市场和新闻数据建立 run 隔离的 Evidence 台账，记录来源、抓取时间、公开可用时间、片段、哈希及资格；同来源同时间同内容可去重，不得用抓取时间替代未知公开时间。
  priority: Must
  status: proposed
  owner: solo_student
  scope: extended_baseline
  source_ids:
  - SRC-COURSE-SPEC
  - SRC-UP-DATE
  - SRC-UP-NODATA
  - SRC-PROPOSAL
  rationale: 为引用、语义评估和回放提供可核对证据。
  tradeoff: 时间资格未知时允许降级，不能用扩大覆盖牺牲时点完整性。
  related_ids:
  - FR-001
  - INV-003
  fit_criterion:
    protocol_id: VP-EVIDENCE
    preconditions: 阈值、基线、数据集与协议先经人工评审并冻结；下列测试尚未实施。
    metrics:
    - name: evidence_assertion_pass_rate
      operator: gte
      target: 1.0
      unit: ratio
      measurement: DS-EVIDENCE 中字段、唯一性、去重、引用及时间资格断言通过数 / 总断言数。
    positive_case: 合格新闻保留 published_at 与片段；重复同源材料合并，独立来源指针保留。
    negative_case: 未来或发布日期未知的材料被隔离；源不可达不能记录为真实无新闻。
  verification:
    tier: behavioral
    planned_test_ids:
    - AT-FR-002-POS
    - AT-FR-002-NEG
    evidence_status: not_run
    evidence_paths: []
- id: FR-003
  type: functional
  title: 带引用的结构化论点与冲突记录
  statement: AI 研究流程必须以 Claim 卡片表达重要事实、推断、引用和不确定性，明确多空冲突及结论依据；默认研究/风险辩论各最多1轮，格式修正至多1次且经过预算预留。
  priority: Must
  status: proposed
  owner: solo_student
  scope: extended_baseline
  source_ids:
  - SRC-UP-SCHEMA
  - SRC-UP-PARALLEL
  - SRC-COURSE-INTRO
  - SRC-PROPOSAL
  rationale: 让推理材料可检查，减少无效重复；实际质量与成本另行实验。
  tradeoff: 减少轮次不能替代质量评估；保留上游角色职责，不承诺辩论必然节省token。
  related_ids:
  - FR-002
  - FR-004
  - FR-005
  fit_criterion:
    protocol_id: VP-DEBATE
    preconditions: 阈值、基线、数据集与协议先经人工评审并冻结；下列测试尚未实施。
    metrics:
    - name: debate_assertion_pass_rate
      operator: gte
      target: 1.0
      unit: ratio
      measurement: DS-DEBATE 中事实/推断分离、引用要求、冲突与停止状态断言通过数 / 全部断言数。
    - name: uncited_facts_in_publishable_artifact
      operator: eq
      target: 0
      unit: count
      measurement: 可进入发布检查的重要事实卡片中，合格引用为空的数量。
    positive_case: 多空卡片引用不同证据，结论说明如何处理冲突，不复制无关历史。
    negative_case: 缺引用、格式错误或重复卡片在有限修正后仍无效，输出 blocked/degraded 草稿。
  verification:
    tier: behavioral
    planned_test_ids:
    - AT-FR-003-POS
    - AT-FR-003-NEG
    evidence_status: not_run
    evidence_paths: []
- id: FR-004
  type: functional
  title: 独立最终输出门禁
  statement: 系统必须用独立于 LLM 的确定性代码检查最终 Schema、引用身份、时间资格、数值类型与状态条件；任何结构化或自由文本回退结果都经过同一门禁，检查失败或验证器故障时保持 draft/blocked。
  priority: Must
  status: proposed
  owner: solo_student
  scope: increment
  source_ids:
  - SRC-COURSE-SPEC
  - SRC-UP-STRUCT
  - SRC-UP-PM
  - SRC-PROPOSAL
  rationale: 构成课程要求的确定性安全边界。
  tradeoff: Schema和引用通过不等于语义真实；QUAL-001还需单独验证。
  related_ids:
  - FR-002
  - FR-003
  - INV-002
  fit_criterion:
    protocol_id: VP-SAFETY
    preconditions: 阈值、基线、数据集与协议先经人工评审并冻结；下列测试尚未实施。
    metrics:
    - name: invalid_artifact_release_count
      operator: eq
      target: 0
      unit: count
      measurement: 100 个违规安全案例中被标记 released 的产物数。
    - name: valid_control_awaiting_review_rate
      operator: gte
      target: 1.0
      unit: ratio
      measurement: 10 个合法控制案例中进入 completed+passed+not_reviewed+draft 的比例。
    positive_case: 合格结构化产物得到 passed 和待审阅状态，保存每项 gate 结果。
    negative_case: 伪造引用、未来证据、解析失败、free-text 回退或验证器异常均不能绕过检查。
  verification:
    tier: behavioral
    planned_test_ids:
    - AT-FR-004-POS
    - AT-FR-004-NEG
    evidence_status: not_run
    evidence_paths: []
- id: FR-005
  type: functional
  title: 全局预算与失败处置
  statement: 所有模型尝试必须经统一、原子化的运行账本预留和结算，含失败、重试、回退、反思和模型评估；默认60,000累计token、30次模型尝试、900秒期限；模型与数据源瞬时失败各最多重试1次，禁止未观测的SDK重试。
  priority: Must
  status: proposed
  owner: solo_student
  scope: extended_baseline
  source_ids:
  - SRC-UP-CONFIG
  - SRC-UP-STATS
  - SRC-COURSE-RUNTIME
  - SRC-PROPOSAL
  rationale: 已有单调用上限和统计不足以证明整次运行资源受控。
  tradeoff: 终止可能增加降级；取消本地请求不等于提供方停止计费。
  related_ids:
  - FR-001
  - INV-004
  fit_criterion:
    protocol_id: VP-BUDGET
    preconditions: 阈值、基线、数据集与协议先经人工评审并冻结；下列测试尚未实施。
    metrics:
    - name: budget_scenario_pass_rate
      operator: gte
      target: 1.0
      unit: ratio
      measurement: 30 个预算案例中记账、并发、未知用量和终止行为全符合预期的比例。
    - name: calls_started_after_stop
      operator: eq
      target: 0
      unit: count
      measurement: 在模拟期限、预算或安全停止事件后的新外部请求数。
    - name: local_stop_event_flush_max
      operator: lte
      target: 2
      unit: seconds
      measurement: provider stub 和模拟时钟下，停止判定至终止事件落盘的最大本地耗时。
    positive_case: 并发前共同预留，正常返回按 provider 定义结算，所有回退可追踪。
    negative_case: 剩余不足、用量未知、429或超时后停止新请求，记录明确原因而不伪装为 Hold。
  verification:
    tier: behavioral
    planned_test_ids:
    - AT-FR-005-POS
    - AT-FR-005-NEG
    evidence_status: not_run
    evidence_paths: []
- id: FR-006
  type: functional
  title: 完整成对评估包
  statement: 系统必须导出 baseline/candidate 的逐任务逐重复评估记录，包含版本、相同输入哈希、全部调用用量、耗时、质量、失败与局限；保留所有6对运行，关联新增 gate 和证据摘要。
  priority: Must
  status: proposed
  owner: solo_student
  scope: extended_baseline
  source_ids:
  - SRC-COURSE-DEMO
  - SRC-UP-README
  - SRC-PROPOSAL
  rationale: 使工程改进有前后对比证据，支持10分钟演示。
  tradeoff: 复用上游报告导出，新增的是证据、门禁和实验契约而非导出本身。
  related_ids:
  - FR-004
  - FR-005
  - COST-001
  fit_criterion:
    protocol_id: VP-LIVE
    preconditions: 阈值、基线、数据集与协议先经人工评审并冻结；下列测试尚未实施。
    metrics:
    - name: evaluation_pair_record_count
      operator: eq
      target: 6
      unit: pairs
      measurement: 3固定股票任务×2重复，每对含两组状态；失败和超时仍有记录。
    - name: evaluation_metadata_complete_rate
      operator: gte
      target: 1.0
      unit: ratio
      measurement: 12条记录的版本、输入、状态、失败原因和已知/未知用量标记完整比例。
    positive_case: 两组同源快照和模型，分别导出结果与指标，并能定位每个失败。
    negative_case: 缺少baseline、删掉失败、改变数据却使用相同实验名，评估包判无效。
  verification:
    tier: behavioral
    planned_test_ids:
    - AT-FR-006-POS
    - AT-FR-006-NEG
    evidence_status: not_run
    evidence_paths: []
- id: FR-007
  type: functional
  title: 绑定产物版本的人工审阅发布
  statement: 系统必须记录人工审阅者、时间、理由、run、修订和内容哈希；只有completed+passed且当前哈希获得人工批准的报告可released，内容、证据或策略改变应使旧批准失效。 artifact_hash覆盖规范化业务配置、证据、事实/推断、正文与验证策略，排除自身、审阅事件、发布状态及耗时。
  priority: Must
  status: proposed
  owner: solo_student
  scope: increment
