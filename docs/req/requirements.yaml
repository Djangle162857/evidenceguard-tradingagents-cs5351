- id: QUAL-001
  type: quality
  title: 事实的证据语义支持
  statement: 候选方案必须对重要事实逐条提供支持证据；DS-LIVE由唯一学生隐藏组别标注并至少间隔24小时复核，保留修改轨迹；不报告第二位人类一致率，空报告不得满分。
  priority: Must
  status: proposed
  owner: solo_student
  scope: increment
  source_ids:
  - SRC-COURSE-SPEC
  - SRC-PROPOSAL
  rationale: 防止把引用可解析误当作真实与可靠。
  tradeoff: 采用可核对的人类标签汇总；不使用同一模型自评分作为唯一真值。
  related_ids:
  - FR-002
  - FR-004
  - QUAL-002
  fit_criterion:
    protocol_id: VP-LIVE
    preconditions: 阈值、基线、数据集与协议先经人工评审并冻结；下列测试尚未实施。
    metrics:
    - name: supported_material_claim_ratio
      operator: gte
      target: 0.95
      unit: ratio
      measurement: 候选完成报告的supported重要事实 / 全部重要事实；unsupported和unverifiable都不算支持。
    - name: material_claim_annotation_coverage
      operator: eq
      target: 1.0
      unit: ratio
      measurement: 全部重要事实均有supported/unsupported/unverifiable标签、理由和证据定位。
    - name: solo_recheck_coverage
      operator: eq
      target: 1.0
      unit: ratio
      measurement: 全部已标注重要事实有至少间隔24小时的同人复核记录；AI标签不能替代。
    positive_case: 重要数字、事件与推荐理由中的事实均进入标注，引用确能支持所述范围。
    negative_case: 引用存在但不支持、无法验证或选择性漏标重要事实，计不支持或协议无效。
  verification:
    tier: behavioral
    planned_test_ids:
    - AT-QUAL-001-POS
    - AT-QUAL-001-NEG
    evidence_status: not_run
    evidence_paths: []
- id: QUAL-002
  type: quality
  title: 可用性与实用性保护
  statement: 候选6次评估的可用率必须至少80%且不低于baseline可用率减0.05，可用报告平均实用性至少4/5；至少一条重要事实、支持率达标且完成外部共同检查的报告才可用。 六次中至少5次可用，且成功数不少于baseline。
  priority: Must
  status: proposed
  owner: solo_student
  scope: increment
  source_ids:
  - SRC-COURSE-SPEC
  - SRC-PROPOSAL
  rationale: 防止用减少有用输出取得表面成本改善。
  tradeoff: 每组6次，仅支持冻结样本的描述性结论；不外推收益或宣称统计显著。
  related_ids:
  - FR-006
  - QUAL-001
  - COST-001
  fit_criterion:
    protocol_id: VP-LIVE
    preconditions: 阈值、基线、数据集与协议先经人工评审并冻结；下列测试尚未实施。
    metrics:
    - name: candidate_usable_rate
      operator: gte
      target: 0.8
      unit: ratio
      measurement: 符合冻结可用定义的candidate报告数 / 6；失败、超时和空报告不删除。
    - name: candidate_minus_baseline_usable_rate
      operator: gte
      target: -0.05
      unit: ratio
      measurement: candidate可用率减baseline可用率；两组同分母6。
    - name: usable_report_mean_rubric_score
      operator: gte
      target: 4.0
      unit: points_out_of_5
      measurement: 可用报告按5项各1分rubric的平均分；无可用报告则失败。
    positive_case: 报告回应标的日期、有正反观点、分离事实推断、说明不确定性、结论与引用一致。
    negative_case: 提前拒绝全部任务虽节省token，仍因可用率不足失败；删除超时样本使协议无效。
  verification:
    tier: behavioral
    planned_test_ids:
    - AT-QUAL-002-POS
    - AT-QUAL-002-NEG
    evidence_status: not_run
    evidence_paths: []
