name: Course gates
'on':
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: course-gates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - test-approval
          - static-analysis
          - requirements-schema
          - semantic-evaluation
          - regression
          - ai-use-log
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]' socksio
      - name: Run ${{ matrix.check }}
        run: python -m evidenceguard.verification '${{ matrix.check }}'
